{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In · Roommate Match</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <!-- Login CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
</head>
<body>

    <!-- ====== HEADER ====== -->
    <header class="header" id="header">
        <div class="container header__container">
            <a href="/" class="logo">
                <i class="fas fa-home logo__icon"></i>
                Roommate Match
            </a>
            <div class="header__actions">
                <a href="/accounts/login/" class="btn btn--primary btn--sm active">Log In</a>
                <a href="/accounts/signup/" class="btn btn--outline btn--sm">Sign Up</a>
            </div>
        </div>
    </header>

    <!-- ====== LOGIN SECTION ====== -->
    <section class="login">
        <div class="container login__container">
            <div class="login__card">
                <div class="login__header">
                    <h1 class="login__title">Welcome Back! 👋</h1>
                    <p class="login__subtitle">
                        Log in to your account and find your perfect roommate.
                    </p>
                </div>

                <!-- ====== FORM ====== -->
                <form id="loginForm" class="login__form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="john_doe" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required />
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember" />
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn--primary btn--lg btn--full" id="loginBtn">
                        Log In <i class="fas fa-arrow-right"></i>
                    </button>

                    <div id="loginMessage" class="login__message" style="display: none;"></div>
                </form>

                <div class="login__footer">
                    <p>
                        Don't have an account?
                        <a href="/accounts/signup/">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- ====== FOOTER ====== -->
    <footer class="footer footer--simple">
        <div class="container footer__bottom-container">
            <span>&copy; 2026 Roommate Match. All rights reserved.</span>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
